<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting&hellip;</title>
  <link rel="canonical" href="https://andybromberg.com/congruence/widgets">
  <script>location.replace('https://andybromberg.com/congruence/widgets');</script>
  <meta http-equiv="refresh" content="0; url=https://andybromberg.com/congruence/widgets">
  <meta name="robots" content="noindex">
  <style>body{display:none;}</style>
</head>
<body>
  <noscript><meta http-equiv="refresh" content="0; url=https://andybromberg.com/congruence/widgets"></noscript>
  <p><a href="https://andybromberg.com/congruence/widgets">Click here if not redirected.</a></p>
</body>
</html>
